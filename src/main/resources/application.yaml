spring:
  application:
    name: team-access-api

  # How Java finds your local Postgres (the filing cabinet)
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/team_access_db
    username: paramitamallik
    password: ""

  # Hibernate: move rows in/out. It does NOT create tables.
  # validate = check Java entities match real tables (once we add entities).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway: run numbered .sql files from db/migration at startup
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis is in pom.xml but we do not use it until Day 7.
  # Excluding auto-config means Spring will not try to connect to Redis yet.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
