spring:
  application:
    name: team-access-api

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/team_access_db
    username: paramitamallik
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis is in pom.xml but we do not use it until Day 7.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your-super-secret-jwt-key-change-this-in-production-at-least-256-bits-long-for-hs256-algorithm
  expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.teamaccess: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
